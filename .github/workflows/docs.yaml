# Simple workflow for deploying static content to GitHub Pages
name: Deploy Docusaurus

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN }}
          submodules: recursive
      # 👇 Build steps
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Use corepack
        run: corepack enable
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: yarn install --immutable
      - name: Fetch SDK packages
        run: yarn prepare
      - name: Build
        run: yarn build --out-dir ./build/docs
      # 👆 Build steps
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 👇 Specify build output path
          path: build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # A new docs version creates a new docusaurus_tag in Algolia. Until the
  # crawler indexes it, contextual search filters on a tag with zero records
  # and the search box returns nothing, so a release must trigger a recrawl.
  # Everything else is covered by the crawler's weekly schedule.
  reindex:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect docs release
        id: rel
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qx 'versions.json'; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Algolia crawler reindex
        if: steps.rel.outputs.released == 'true'
        run: |
          curl -sS -f -X POST \
            -u "${{ secrets.ALGOLIA_CRAWLER_USER_ID }}:${{ secrets.ALGOLIA_CRAWLER_API_KEY }}" \
            "https://crawler.algolia.com/api/1/crawlers/9bc2ab68-0ce9-4f44-9824-3a48219680b2/reindex"
